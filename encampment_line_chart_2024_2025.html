<html>
<head><meta charset="utf-8" /></head>
<body>
<div>
<script type="text/javascript">window.PlotlyConfig = {MathJaxConfig: 'local'};</script>
<script charset="utf-8" src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<div id="reports311chart" class="plotly-graph-div" style="height:420px; width:800px;"></div>
<script type="text/javascript">
window.PLOTLYENV = window.PLOTLYENV || {};
if (document.getElementById("reports311chart")) {
  var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var counts2024 = [6642,5359,5139,4931,5394,4867,5406,4985,5199,4656,3943,2827];
  var counts2025 = [3567,3268,3500,3193,3293,3171,3327,3970,3419,3529,3181,2633];
  var colors = ["#1f4aff","#d62728","#2ca02c","#ff00ff","#8c564b","#17becf","#b5a642","#98df8a","#7f7f7f","#c51b8a","#6a1b6a","#f4a3b4"];

  Plotly.newPlot(
    "reports311chart",
    [
      {
        hovertemplate: "<b>2024</b><br>%{x}: %{y}<extra></extra>",
        line: {color: "black", width: 3},
        mode: "lines",
        name: "2024",
        x: months,
        y: counts2024,
        type: "scatter"
      },
      {
        hovertemplate: "<b>2024</b><br>%{x}: %{y}<extra></extra>",
        marker: {color: colors, line: {color: "black", width: 1}, size: 11},
        mode: "markers",
        name: "2024 Monthly Points",
        showlegend: false,
        x: months,
        y: counts2024,
        type: "scatter"
      },
      {
        hovertemplate: "<b>2025</b><br>%{x}: %{y}<extra></extra>",
        line: {color: "#e8c400", width: 3},
        mode: "lines",
        name: "2025",
        x: months,
        y: counts2025,
        type: "scatter"
      },
      {
        hovertemplate: "<b>2025</b><br>%{x}: %{y}<extra></extra>",
        marker: {color: colors, line: {color: "#e8c400", width: 1}, size: 11},
        mode: "markers",
        name: "2025 Monthly Points",
        showlegend: false,
        x: months,
        y: counts2025,
        type: "scatter"
      }
    ],
    {
      title: {
        font: {size: 24, color: "navy", family: "Roboto"},
        text: "<b>311 Encampment Reports by Month</b>",
        x: 0,
        xanchor: "left"
      },
      xaxis: {
        title: {font: {size: 14, family: "Roboto"}, text: "<b>Month</b>"},
        tickfont: {size: 11, family: "Roboto"},
        categoryorder: "array",
        categoryarray: months,
        tickangle: 0
      },
      yaxis: {
        title: {font: {size: 14, family: "Roboto"}, text: "<b>Report Count</b>"},
        tickfont: {size: 11, family: "Roboto"},
        rangemode: "tozero"
      },
      legend: {
        title: {font: {size: 12, family: "Roboto"}, text: "<b>Year</b>"},
        font: {size: 11, family: "Roboto"},
        orientation: "h",
        yanchor: "bottom",
        y: 1.02,
        xanchor: "right",
        x: 1
      },
      hoverlabel: {font: {size: 12, family: "Roboto"}},
      margin: {l: 55, r: 20, t: 80, b: 50},
      autosize: true
    },
    {responsive: true}
  );
}
</script>
</div>
</body>
</html>
