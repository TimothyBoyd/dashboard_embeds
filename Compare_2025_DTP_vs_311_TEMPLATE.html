<html>
<head><meta charset="utf-8" /></head>
<body>
<div>
<script type="text/javascript">window.PlotlyConfig = {MathJaxConfig: 'local'};</script>
<script charset="utf-8" src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<div id="compare2025chart" class="plotly-graph-div" style="height:400px; width:1200px;"></div>
<script type="text/javascript">
window.PLOTLYENV = window.PLOTLYENV || {};
if (document.getElementById("compare2025chart")) {
  var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  // 311 data is real (confirmed 2025 data)
  var counts311_2025 = [3567,3268,3500,3193,3293,3171,3327,3970,3419,3529,3181,2633];

  // ====== PLACEHOLDER ======
  // Replace these 12 values with real DTP 2025 monthly totals once you have
  // the export. Run aggregate_dtp_monthly.py on the file and paste the
  // "monthly_total_count" list in here, in order Jan -> Dec.
  var countsDTP_2025 = [null,null,null,null,null,null,null,null,null,null,null,null];
  // ==========================

  Plotly.newPlot(
    "compare2025chart",
    [
      {
        hovertemplate: "<b>311 Reports</b><br>%{x}: %{y}<extra></extra>",
        line: {color: "navy", width: 3},
        mode: "lines+markers",
        marker: {size: 8},
        name: "311 Encampment Reports",
        x: months,
        y: counts311_2025,
        type: "scatter",
        yaxis: "y"
      },
      {
        hovertemplate: "<b>DTP Count</b><br>%{x}: %{y}<extra></extra>",
        line: {color: "#B8860B", width: 3, dash: "dot"},
        mode: "lines+markers",
        marker: {size: 8},
        name: "DTP Encampment Count (pending data)",
        x: months,
        y: countsDTP_2025,
        type: "scatter",
        yaxis: "y2",
        connectgaps: false
      }
    ],
    {
      title: {
        font: {size: 24, color: "navy", family: "Roboto"},
        text: "<b>2025: 311 Reports vs. DTP Encampment Counts by Month</b>"
      },
      xaxis: {
        title: {font: {size: 14, family: "Roboto"}, text: "<b>Month</b>"},
        tickfont: {size: 11, family: "Roboto"},
        categoryorder: "array",
        categoryarray: months,
        tickangle: 0
      },
      yaxis: {
        title: {font: {size: 14, family: "Roboto", color: "navy"}, text: "<b>311 Report Count</b>"},
        tickfont: {size: 11, family: "Roboto", color: "navy"},
        rangemode: "tozero"
      },
      yaxis2: {
        title: {font: {size: 14, family: "Roboto", color: "#B8860B"}, text: "<b>DTP Count</b>"},
        tickfont: {size: 11, family: "Roboto", color: "#B8860B"},
        rangemode: "tozero",
        overlaying: "y",
        side: "right"
      },
      legend: {
        font: {size: 11, family: "Roboto"},
        orientation: "h",
        yanchor: "bottom",
        y: 1.1,
        xanchor: "right",
        x: 1
      },
      hoverlabel: {font: {size: 12, family: "Roboto"}},
      margin: {l: 60, r: 60, t: 90, b: 50},
      width: 1400,
      height: 400,
      annotations: [
        {
          text: "DTP 2025 data pending",
          xref: "paper", yref: "paper",
          x: 0.5, y: 0.5,
          showarrow: false,
          font: {size: 16, color: "#999999", family: "Roboto"},
          opacity: 0.7
        }
      ]
    },
    {responsive: true}
  );
}
</script>
</div>
</body>
</html>
