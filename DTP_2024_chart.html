<html>
<head><meta charset="utf-8" /></head>
<body>
<div>
<script type="text/javascript">window.PlotlyConfig = {MathJaxConfig: 'local'};</script>
<script charset="utf-8" src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<div id="dtp2024chart" class="plotly-graph-div" style="height:400px; width:1200px;"></div>
<script type="text/javascript">
window.PLOTLYENV = window.PLOTLYENV || {};
if (document.getElementById("dtp2024chart")) {
  var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var counts2024 = [800,841,695,690,712,734,762,742,668,747,719,823];
  var colors = ["#1f4aff","#d62728","#2ca02c","#ff00ff","#8c564b","#17becf","#b5a642","#98df8a","#7f7f7f","#c51b8a","#6a1b6a","#f4a3b4"];

  Plotly.newPlot(
    "dtp2024chart",
    [
      {
        hovertemplate: "<b>2024</b><br>%{x}: %{y}<extra></extra>",
        line: {color: "black", width: 3},
        mode: "lines",
        name: "2024",
        x: months,
        y: counts2024,
        type: "scatter"
      },
      {
        hovertemplate: "<b>2024</b><br>%{x}: %{y}<extra></extra>",
        marker: {color: colors, line: {color: "black", width: 1}, size: 11},
        mode: "markers",
        name: "2024 Monthly Points",
        showlegend: false,
        x: months,
        y: counts2024,
        type: "scatter"
      }
    ],
    {
      title: {
        font: {size: 24, color: "navy", family: "Roboto"},
        text: "<b>Downtown Partnership Encampment Counts by Month</b>"
      },
      xaxis: {
        title: {font: {size: 14, family: "Roboto"}, text: "<b>Month</b>"},
        tickfont: {size: 11, family: "Roboto"},
        categoryorder: "array",
        categoryarray: months,
        tickangle: 0
      },
      yaxis: {
        title: {font: {size: 14, family: "Roboto"}, text: "<b>Total Count</b>"},
        tickfont: {size: 11, family: "Roboto"},
        rangemode: "tozero"
      },
      legend: {
        title: {font: {size: 12, family: "Roboto"}, text: "<b>Year</b>"},
        font: {size: 11, family: "Roboto"},
        orientation: "h",
        yanchor: "bottom",
        y: 1.02,
        xanchor: "right",
        x: 1
      },
      hoverlabel: {font: {size: 12, family: "Roboto"}},
      margin: {l: 50, r: 30, t: 70, b: 50},
      width: 1400,
      height: 300
    },
    {responsive: true}
  );
}
</script>
</div>
</body>
</html>
